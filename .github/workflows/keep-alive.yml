name: Supabase Keep Alive

on:
  schedule:
    # A cada 3 dias, 09:17 UTC. Evita os minutos mais concorridos do GitHub Actions.
    - cron: "17 9 */3 * *"
  push:
    paths:
      - ".github/workflows/keep-alive.yml"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://nhrzaeteadlzvgqfqzkr.supabase.co
      # Publishable key publica do frontend. Nao usar service_role aqui.
      # Pode ser sobrescrita por uma repository variable se a chave for rotacionada.
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_4vudSxBAP0wT6w8Jnwi6Mw_c9MrUukm' }}

    steps:
      - name: Validar secret obrigatorio
        shell: bash
        run: |
          if [ -z "${SUPABASE_PUBLISHABLE_KEY}" ]; then
            echo "::error::Configure o repository secret SUPABASE_PUBLISHABLE_KEY no GitHub."
            exit 1
          fi

      - name: Ping Supabase
        shell: bash
        run: |
          set -euo pipefail

          endpoint="${SUPABASE_URL%/}/rest/v1/users_profiles?select=id&limit=1"
          echo "Chamando endpoint REST do Supabase..."

          status=$(curl --silent --show-error --location \
            --output response.json \
            --write-out "%{http_code}" \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Accept: application/json" \
            "$endpoint")

          echo "HTTP status: ${status}"

          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "Resposta da API:"
            cat response.json
            echo "::error::Ping do Supabase falhou. Se o projeto estiver pausado, restaure no painel da Supabase e rode o workflow manualmente."
            exit 1
          fi

          echo "Supabase keep-alive concluido."
